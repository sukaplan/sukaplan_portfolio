<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4f2" />
    <script>
      try {
        if (localStorage.getItem('su-theme-preference') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#090f1c';
        }
      } catch (error) { /* Default to neutral off-white when storage is unavailable. */ }
    </script>
    <meta name="description" content="Su Kaplan, senior fullstack engineer. Thoughtful interfaces, reliable systems, and selected work across React, .NET and financial software." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Su Kaplan — Senior Fullstack Engineer</title>
    <meta property="og:title" content="Su Kaplan — Senior Fullstack Engineer" />
    <meta property="og:description" content="Between logic and feeling. Thoughtful digital experiences and the reliable systems behind them." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <noscript>Please enable JavaScript to explore Su Kaplan’s portfolio. You can get in touch at suukaplan@outlook.com.</noscript>
    <div id="root"></div>
  </body>
</html>
